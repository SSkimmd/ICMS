upstream store-server {
    server store-server:8082;
}

upstream store-app {
    server store-app:5173;
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>.+).example.test$ example.test;

    location /store-server {
        proxy_pass http://store-server;
    }

    location / {           
        proxy_pass http://store-app;
        proxy_http_version 1.1;
        proxy_set_header    Origin http://$http_host;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection ‘upgrade’;
        proxy_set_header    Host $host;
        proxy_cache_bypass  $http_upgrade;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Subdomain "$subdomain";
    }
}